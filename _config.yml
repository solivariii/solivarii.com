title: Gunnar Bachelor                # browser tab + landing page
tagline: IT automation consulting.
description: Gunnar Bachelor is an IT automation consultant who helps small teams replace repetitive manual work with reliable, documented automation.

intro: >                              # opening text on the blog
  Notes on IT automation: scripting away repetitive work, keeping
  infrastructure reproducible, and building systems that small teams
  can run without a dedicated ops department.

subscribe_note: >
  An occasional email when I publish something new. No tracking, and
  you can unsubscribe in one click.

# Where the subscribe form posts to: the listmonk instance on the droplet.
# newsletter_list is the UUID of the public list (listmonk admin → Lists).
newsletter_url: https://list.solivarii.com/subscription/form
newsletter_list: d66cb111-36d9-4697-bf1f-3170c0fc9c90
# Altcha bot check: a proof-of-work puzzle the visitor's browser solves on submit.
# No third-party service; challenges come from listmonk itself.
newsletter_captcha: https://list.solivarii.com/api/public/captcha/altcha
newsletter_captcha_js: https://list.solivarii.com/public/static/altcha.umd.js

about: >                              # About page text (Markdown)
  I'm Gunnar Bachelor, an IT automation consultant. I help small and
  mid-sized teams take the repetitive, error-prone parts of running
  IT (provisioning, deployments, backups, user management, routine
  maintenance) and turn them into automation that runs the same way
  every time.


  I work hands-on: I read what you have, automate what's worth
  automating, and leave you with code and documentation your team can
  own after I'm gone.


  If something in your IT takes too long, breaks too often, or depends
  on one person remembering the steps, write to the address below and
  tell me a little about it.

email: hello@gunnarbachelor.com
links:
  - label: X
    url: https://x.com/gunnar_bachelor
  - label: GitHub
    url: https://github.com/gunnar-bachelor

# ───────────────────────────────────────────────
#  Site settings
# ───────────────────────────────────────────────
# If the site lives at https://USERNAME.github.io, leave baseurl empty.
# If it lives at https://USERNAME.github.io/REPO, set baseurl: "/REPO".
url: ""                               # e.g. https://example.com (GitHub Pages fills this in if left empty)
baseurl: ""

markdown: kramdown

# Used for X/Twitter share cards.
twitter:
  username: gunnar_bachelor
  card: summary

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
